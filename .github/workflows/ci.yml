name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: alwith-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: alwith-runtime
      - uses: actions/checkout@v4
        with:
          repository: nyssance/alwith-api
          path: alwith-api
          token: ${{ secrets.BUILD_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: nyssance/alwith-modules
          path: alwith-modules
          token: ${{ secrets.BUILD_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alwith-runtime
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
