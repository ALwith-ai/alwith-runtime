name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: alwith-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: alwith-runtime
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alwith-runtime
      - uses: oven-sh/setup-bun@v2
      - run: bun test ./scripts/__tests__/check-windows-runtime.test.ts
      - run: cargo test --locked --workspace
