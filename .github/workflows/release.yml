# Publish Runtime: pushing a v<version> tag builds once on each of the two platforms and publishes to
# npm: the @alwith/runtime main package plus two @alwith/runtime-<os>-<cpu> platform packages. This is
# the only distribution channel: an app's bun install picks the one for its platform, and at build time
# stageRuntime() verifies the sha and copies it into the sidecar. No GitHub Release is published and no
# token is used (npm trusted publishing; on npmjs.com each of the three packages gets one entry:
# Repository alwith-runtime / Workflow release.yml).
# The tag must equal the Cargo workspace version, and also the packages/runtime version and its two
# optionalDependencies.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v<version>)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: alwith-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: alwith-runtime
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: alwith-runtime
      - name: Check the tag matches the workspace version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          [ "$tag" = "v$version" ] || { echo "tag $tag != workspace version $version"; exit 1; }
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
        if: ${{ !contains(matrix.target, 'x86_64-apple') }}
      - run: cargo build --release --locked -p alwith-runtime --target ${{ matrix.target }}
      # Besides the binary the package holds LICENSE, the third-party license texts and BUILD.json:
      # the app's stage script refuses to install if any is missing.
      - uses: oven-sh/setup-bun@v2
      - run: bun test ./scripts/__tests__/check-windows-runtime.test.ts
      - run: bun scripts/package-release.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: alwith-runtime/dist/npm
          if-no-files-found: error

  # The two platform packages are published first, then the @alwith/runtime main package (its
  # optionalDependencies point at them).
  # npm trusted publishing (OIDC): on npmjs.com each of the three packages gets one entry (Repository
  # alwith-runtime / Workflow filename release.yml), so no token is stored. Each package carries
  # provenance linking it to this public repository and run. Versions already on npm are skipped, so
  # a run rejected midway can be re-run.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist/npm
          merge-multiple: true
      - name: The tag version must equal the packages/runtime version, and the two optionalDependencies and two platform packages must match it
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=${tag#v}
          bun -e '
            const pkg = require("./packages/runtime/package.json");
            const want = process.argv[1];
            if (pkg.version !== want) { console.error(`tag v${want} != packages/runtime ${pkg.version}`); process.exit(1) }
            for (const [name, v] of Object.entries(pkg.optionalDependencies)) {
              if (v !== want) { console.error(`${name} pinned to ${v}, expected ${want}`); process.exit(1) }
            }
            const dirs = require("fs").readdirSync("dist/npm");
            if (dirs.length !== 2) { console.error(`expected 2 platform packages, got ${dirs}`); process.exit(1) }
            for (const dir of dirs) {
              const platform = require(`./dist/npm/${dir}/package.json`);
              if (platform.version !== want) { console.error(`${platform.name} is ${platform.version}`); process.exit(1) }
            }
          ' "$version"
      - name: Publish the two platform packages, then the @alwith/runtime main package
        run: |
          publish() {
            name=$(bun -p "require('./package.json').name")
            version=$(bun -p "require('./package.json').version")
            if bun x --bun npm@latest view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm, skipping"
            else
              bun x --bun npm@latest publish --access public --provenance
            fi
          }
          for dir in dist/npm/*/; do (cd "$dir" && publish); done
          (cd packages/runtime && publish)
