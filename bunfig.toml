# Formatting uses Bun; built-in lint requires Bun Canary.
[fmt]
printWidth = 120
semi = false
trailingComma = "none"
sortImports = true
ignorePatterns = [
  "bun.lock",
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/licenses/**",
  "**/bin/**",
  "**/*.svg",
  "**/*.md",
  "**/*.html",
  "**/package.json",
  "**/*.toml",
  "package.json",
]

[lint]
typeAware = true
ignorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
]

[run]
bun = true
