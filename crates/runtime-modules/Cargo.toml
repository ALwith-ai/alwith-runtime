[package]
name = "alwith-runtime-modules"
description = "Module host: discovers alwith-module.json packages, spawns each entry as a subprocess, routes modules/<name>/<method> requests and forwards events both ways"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alwith-runtime-core = { path = "../runtime-core" }
alwith-runtime-ws = { path = "../runtime-ws" }
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
alwith-runtime-stdio = { path = "../runtime-stdio" }
tempfile = "3"
