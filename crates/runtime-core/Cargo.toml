[package]
name = "alwith-runtime-core"
description = "ACP agent process ownership, session run states and the session journal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The core needs only the protocol types, not the client (that is the app side's job)
alwith-runtime-protocol = { path = "../runtime-protocol" }
command-group = { version = "5", features = ["with-tokio"] }
dirs = "7"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
log = "0.4"
netstat2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.40"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
