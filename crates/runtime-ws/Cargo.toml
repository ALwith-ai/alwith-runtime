[package]
name = "alwith-runtime-ws"
description = "The Runtime WebSocket wire protocol: token handshake, request envelopes, event fan-out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alwith-runtime-core = { path = "../runtime-core" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.40"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
alwith-runtime-stdio = { path = "../runtime-stdio" }
async-trait = "0.1"
tempfile = "3"
tokio-tungstenite = "0.30"
