[package]
name = "alwith-runtime-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alwith-runtime-core = { path = "../runtime-core" }
alwith-runtime-ws = { path = "../runtime-ws" }
alwith-api = { path = "../../../alwith-api/crates/api" }
alwith-cli-adapters = { path = "../../../alwith-modules/crates/cli-adapters" }
alwith-qa = { path = "../../../alwith-modules/crates/qa" }
alwith-git = { path = "../../../alwith-modules/crates/git" }
alwith-shell = { path = "../../../alwith-modules/crates/shell" }
alwith-fs = { path = "../../../alwith-modules/crates/fs" }
alwith-store = { path = "../../../alwith-modules/crates/store" }
async-trait = "0.1"
dirs = "7"
log = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
alwith-runtime-stdio = { path = "../runtime-stdio" }
axum = "0.8"
futures-util = "0.3"
tokio-tungstenite = "0.30"
tempfile = "3"
