[workspace]
resolver = "3"
members = ["crates/runtime-protocol", "crates/runtime-core", "crates/runtime-ws", "crates/runtime-stdio", "crates/runtime-modules", "apps/runtime"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
